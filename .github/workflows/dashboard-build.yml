name: Dashboard Build

on:
  push:
    branches: [master, main, feat/*]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run --cwd packages/dashboard typecheck

      - name: Build dashboard frontend
        run: bun run --cwd packages/dashboard build

      - name: Upload dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: packages/dashboard/dist/
          retention-days: 30

  build-plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run --cwd packages/plugin typecheck

      - name: Build plugin
        run: bun run --cwd packages/plugin build

      - name: Run plugin tests
        run: bun run --cwd packages/plugin test

      - name: Upload plugin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: packages/plugin/dist/
          retention-days: 30
