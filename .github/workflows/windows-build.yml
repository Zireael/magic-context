name: Windows Build

on:
  # Automatic triggers (push / pull_request / schedule / release /
  # workflow_run / ...) were removed on 2026-10-31. This workflow now
  # runs only when started by hand: Actions tab -> Run workflow, or
  # `gh workflow run <file>`.
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensures it explicitly targets the branch you are working on
          ref: fix/issue-97-multiplying-numbers

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile the project
        run: bun run build

      - name: Upload compiled plugin as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-context-windows-build
          path: |
            packages/plugin/dist/
            packages/pi-plugin/dist/
            packages/cli/dist/
          retention-days: 7
